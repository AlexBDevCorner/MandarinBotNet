# Repository-scoped Codex tooling. This file contains no credentials.
# Codex loads it only after the repository has been trusted.

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
env_vars = ["CONTEXT7_API_KEY"]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 120
default_tools_approval_mode = "auto"

# GitHub's default toolset: repository, issue, pull-request, and user operations.
[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
enabled = true
required = false
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

# GitHub Actions is a separate hosted toolset.
[mcp_servers.github_actions]
url = "https://api.githubcopilot.com/mcp/x/actions"
bearer_token_env_var = "GITHUB_PAT_TOKEN"
enabled = true
required = false
tool_timeout_sec = 120
default_tools_approval_mode = "writes"

# Oracle's official general-purpose OCI MCP server, launched through a local
# Windows compatibility shim that redirects its hardcoded /tmp/audit.log path.
# The server reads the normal OCI CLI profile from %USERPROFILE%/.oci/config.
[mcp_servers.oracle_oci]
command = "cmd.exe"
args = ["/d", "/q", "/c", ".tools\\oracle-mcp\\Scripts\\python.exe", "scripts\\oracle_oci_mcp_windows.py"]
env_vars = ["OCI_CONFIG_FILE"]
enabled = true
required = false
startup_timeout_sec = 60
tool_timeout_sec = 180
# invoke_oci_api can perform both reads and writes, so prompt for every call.
default_tools_approval_mode = "prompt"

[mcp_servers.oracle_oci.env]
# Keep uv's downloaded MCP package/cache under the ignored repository tools dir.
UV_CACHE_DIR = ".tools/uv-cache"
OCI_CONFIG_PROFILE = "mandarinbot-agent"

[mcp_servers.atlassian]
command = "uvx"
args = ["mcp-atlassian"]
env_vars = ["JIRA_API_TOKEN", "JIRA_URL", "JIRA_USERNAME"]
enabled = true
required = false
startup_timeout_sec = 30.0
tool_timeout_sec = 120.0
# The server exposes Jira write operations, so require approval for writes.
default_tools_approval_mode = "writes"

[mcp_servers.atlassian.env]
# Keep uv's MCP package, tool environment, and Python interpreter inside the repo sandbox.
UV_CACHE_DIR = ".tools/uv-cache"
UV_TOOL_DIR = ".tools/uv-tools"
UV_PYTHON = ".tools/uv-python/cpython-3.13.13-windows-x86_64-none/python.exe"
READ_ONLY_MODE = "false"

[mcp_servers.ado]
command = "powershell"
args = ["-NoProfile", "-NonInteractive", "-Command", "$env:PERSONAL_ACCESS_TOKEN = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes(\"codex:$env:PERSONAL_ADO_PAT\")); & npx.cmd -y @azure-devops/mcp $env:ADO_ORGANIZATION --authentication pat -d core work work-items repositories pipelines wiki; exit $LASTEXITCODE"]
env_vars = ["ADO_ORGANIZATION", "PERSONAL_ADO_PAT"]
startup_timeout_sec = 30.0
tool_timeout_sec = 120.0
enabled = true
required = false
# The selected domains include work-item, repository, pipeline, and wiki writes.
default_tools_approval_mode = "writes"

[mcp_servers.ado.tools.repo_list_pull_request_thread_comments]
approval_mode = "approve"

[mcp_servers.ado.tools.repo_list_pull_request_threads]
approval_mode = "approve"
